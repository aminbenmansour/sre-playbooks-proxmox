name: Test Runbooks and Libraries

on:
  push:
    branches: [ "main" ]
    paths:
      # Only run if notebooks or helper functions changes
      - 'runbooks/**'
      - 'library/**'
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  test-python-and-notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Python dependencies
      run: pip install -r requirements/testing.txt

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Python dependencies
      run: pip install -r requirements/testing.txt

    - name: Run pre-commit checks
      uses: pre-commit/action@v3.0.1

    - name: Validate Jupytext Markdown formatting
      run: |
        jupytext --test runbooks/**/*.md
