name: Deploy PR Preview to Staging Environment

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  deployments: write
  contents: write
  checks: read
  statuses: read

jobs:
  preview:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - uses: github/branch-deploy@v11.1.2
        id: branch-deploy
        with:
          trigger: ".deploy"
          noop_trigger: ".noop"
          environment: "staging"
          stable_branch: "main"
          skip_ci: "staging"
          skip_reviews: "staging"

      - uses: actions/checkout@v4
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        with:
          ref: ${{ steps.branch-deploy.outputs.sha }}

      - name: Set up Quarto
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        run: pip install -r requirements/docs.txt

      - name: Render Quarto (noop)
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop == 'true' }}
        run: |
          cd docs && quarto render
          echo "✅ Noop: rendered successfully, no deploy performed."

      - name: Render and deploy to staging
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' }}
        run: cd docs && quarto render

      - name: Push to gh-pages staging subfolder
        if: ${{ steps.branch-deploy.outputs.continue == 'true' && steps.branch-deploy.outputs.noop != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          destination_dir: previews/pr-${{ github.event.issue.number }}
          keep_files: true
