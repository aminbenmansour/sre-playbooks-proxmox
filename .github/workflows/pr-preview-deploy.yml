name: Deploy Github Pages PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]
    paths:
      - 'docs/**'

permissions:
  contents: write        # needed to push to gh-pages branch
  pull-requests: write   # needed to post the comment

jobs:
  preview:
    environment:
      name: Staging
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/pr-${{ github.event.number }}/

    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        if: ${{ steps.branch-deploy.outputs.continue == 'true' }}
        run: pip install -r requirements/docs.txt

      - name: Render Quarto Project
        run: |
          cd docs
          quarto render

      - name: Deploy preview to gh-pages/staging/pr-<number>
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          destination_dir: staging/pr-${{ github.event.number }}
          keep_files: true   # don't wipe other previews

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number;
            const url = `https://${context.repo.owner}.github.io/${context.repo.repo}/staging/pr-${pr}/`;
            const body = `## 📖 Docs Preview Ready\n\n🔗 ${url}\n\n> Deployed from commit ${context.sha.slice(0, 7)}`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('Docs Preview Ready')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr,
                body,
              });
            }
