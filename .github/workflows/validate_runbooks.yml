name: Validate Runbooks

on:
  push:
    branches: [ "main" ]
    paths:
      - 'runbooks/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'runbooks/**'

  workflow_dispatch:

jobs:
  validate-markdown:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Python dependencies
      run: pip install -r requirements/formatting.txt

    - name: Run pre-commit checks
      uses: pre-commit/action@v3.0.1

    - name: Validate Jupytext Markdown formatting
      run: |
        # Only validate .md runbooks — .py Marimo apps are validated by the
        # test_libraries workflow via flake8 and pre-commit instead.

        # jupytext --check "cmd {}" works by:
        # 1. Converting the .md file to a notebook in memory
        # 2. Running cmd {} where {} is replaced with the converted notebook path
        # 3. Failing if the command exits non-zero

        # cat just reads the file and exits 0 — so it's essentially a no-op check command.
        # The real validation happens in step 1 — if jupytext can't parse the markdown
        # into a valid notebook, it fails before cat ever runs.

        shopt -s globstar nullglob
        md_files=(runbooks/**/*.md)
        if [ ${#md_files[@]} -gt 0 ]; then
          jupytext --check "cat {}" "${md_files[@]}"
        else
          echo "No Jupytext .md runbooks found — skipping."
        fi

  validate-marimo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install Python dependencies
      run: pip install -r requirements/docs.txt

    - name: Validate Marimo runbook syntax
      run: python -m compileall runbooks
