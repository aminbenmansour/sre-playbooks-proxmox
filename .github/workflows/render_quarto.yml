name: Publish SRE Knowledge Base

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: Production
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: pip install -r requirements/docs.txt

      - name: Render Quarto Project
        run: |
          cd docs
          quarto render

      - name: Deploy to gh-pages/production
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          destination_dir: production
          keep_files: true  # don't wipe staging previews

      - name: Create root redirect to production
        run: |
          mkdir -p /tmp/redirect
          cat > /tmp/redirect/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./production/">
              <link rel="canonical" href="./production/">
              <title>Redirecting…</title>
            </head>
            <body>
              <p>Redirecting to <a href="./production/">documentation</a>…</p>
            </body>
          </html>
          HTML

      - name: Deploy root redirect to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/redirect
          destination_dir: .
          keep_files: true

