name: Publish SRE Knowledge Base

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'  # Only run if documentation changes
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Project
        run: |
          cd docs
          quarto render

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site/  # Quarto's default output directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        